<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-surface">

<span class="font-headline-md text-headline-md tracking-tight text-on-surface">cadeApp</span>
</div>
<div class="w-2"></div>
</header>
<!-- Main Content Flow -->
<main class="flex-1 px-margin pt-space-lg pb-space-xl flex flex-col">
<!-- Brand Motif Section Accent -->
<div class="mb-space-lg">
<h1 class="font-headline-xl text-headline-xl text-on-surface">Ingresá a tu cuenta</h1>
<!-- Subtle road wave vector accent motif -->
<div class="mt-2.5 flex items-center gap-2">
<svg class="text-tertiary" fill="none" height="6" viewbox="0 0 44 6" width="44" xmlns="http://www.w3.org/2000/svg">
<path d="M1 3C5 0.5 8 0.5 12 3C16 5.5 19 5.5 23 3C27 0.5 30 0.5 34 3C38 5.5 41 5.5 43 3" stroke="#09BABD" stroke-linecap="round" stroke-width="2.5"></path>
</svg>
<span class="font-body-md text-body-md text-secondary">Logística simple para tu ciudad</span>
</div>
</div>
<!-- Sign In Form -->
<form class="space-y-space-md" onsubmit="event.preventDefault();">
<!-- Email Input Stack -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-[10px] bg-surface-container-lowest border border-outline-variant text-body-lg font-body-lg text-on-surface placeholder:text-secondary/60 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="email" placeholder="tu@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input Stack -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
</div>
<div class="relative flex items-center">
<input class="w-full h-12 pl-4 pr-12 rounded-[10px] bg-surface-container-lowest border border-outline-variant text-body-lg font-body-lg text-on-surface placeholder:text-secondary/60 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container tracking-wider transition-all" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-3 p-1.5 text-secondary hover:text-on-surface transition-colors flex items-center justify-center rounded" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="text-right pt-1">
<a class="font-label-sm text-label-sm text-tertiary hover:underline font-medium focus:outline-none focus:underline" href="#">
              ¿Olvidaste tu contraseña?
            </a>
</div>
</div>
<!-- Primary Submit Button -->
<div class="pt-2">
<button class="w-full h-12 rounded-[10px] bg-primary-container text-on-primary-container font-headline-md text-headline-md flex items-center justify-center tracking-normal hover:opacity-90 active:scale-[0.99] transition-all duration-150" type="submit">
            Ingresar
          </button>
</div>
<!-- Divider with 'o' -->
<div class="relative py-2 flex items-center justify-center">
<div class="w-full border-t border-outline-variant"></div>

</div>

<span>Recibir un código por email</span>
</button>

<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-secondary">
          ¿No tenés cuenta? 
          <a class="text-tertiary font-label-md text-label-md font-semibold hover:underline ml-1" href="#">
            Registrate
          </a>
</p>

<footer class="w-full max-w-[390px] mx-auto px-4 py-8 flex flex-col gap-4 text-center items-center border-t border-outline-variant/40 bg-surface-container-lowest">

<span class="text-outline-variant">•</span>

<p class="font-body-md text-body-md text-secondary text-xs">

      </p>

</div>
<script>
    // Password visibility toggle
    const togglePasswordBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if (togglePasswordBtn && passwordInput && eyeIcon) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          eyeIcon.textContent = 'visibility_off';
          eyeIcon.setAttribute('data-icon', 'visibility_off');
        } else {
          passwordInput.setAttribute('type', 'password');
          eyeIcon.textContent = 'visibility';
          eyeIcon.setAttribute('data-icon', 'visibility');
        }
      });
    }
  </script>
