name: approval-policy

on:
  pull_request_target:
    branches: [develop, staging, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  approval-policy:
    name: approval-policy
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.base.ref == 'develop' || github.event.pull_request.base.ref == 'staging' || github.event.pull_request.base.ref == 'main' }}
    steps:
      - name: Checkout trusted base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Evaluate approvals and review report
        run: node .github/workflows/approval-policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
