name: e2e-preview

# Las PR internas se validan contra un build del SHA exacto hecho en este runner, con Supabase Develop compartido
# (T-422). Vercel ya no construye un Preview por PR: los minutos de build de Vercel se cobran y los de Actions no.
#
# `workflow_run` del CI y no `pull_request`: corre siempre con el workflow de la rama por defecto, así que la PR
# bajo prueba no puede reescribir este gate ni el código que decide si recibe secretos. Arranca solo cuando el CI
# de la PR terminó en verde.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  resolve:
    name: resolve-pull-request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      run: ${{ steps.target.outputs.run }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve trusted pull request target
        id: target
        run: node .github/workflows/e2e-preview-target.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  e2e:
    name: e2e-preview
    needs: resolve
    if: needs.resolve.outputs.run == 'true'
    # ubuntu-latest pasó a 26.04 y Playwright 1.55.1 no instala Chromium ahí (run 42117303547): versión fija.
    runs-on: ubuntu-24.04
    environment: develop
    # Build, chromium (~40 min en serie en el runner) y global-settings: con 45 el segundo proyecto no entraba.
    timeout-minutes: 75
    permissions:
      contents: read
    # Un solo grupo para todas las PR y e2e-mutation: Supabase Develop es compartido y `--workers=1` solo serializa
    # adentro de una corrida. `queue: max` deja hasta 100 corridas pendientes en vez de una (D03=B).
    concurrency:
      group: cadeapp-develop-e2e
      cancel-in-progress: false
      queue: max
    env:
      # El servidor escucha solo en 127.0.0.1; el browser entra por localhost porque NextURL canoniza los hosts
      # loopback a localhost y la redirección del middleware no puede cambiar de origen (perdería la sesión).
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Supabase Develop target
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_DEVELOP_PROJECT_REF }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_STAGING_PROJECT_REF" ]; then
            echo '::error::Falta la variable SUPABASE_DEVELOP_PROJECT_REF o SUPABASE_PROJECT_REF.'
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" = "$SUPABASE_STAGING_PROJECT_REF" ]; then
            echo '::error::El ref de develop debe ser distinto al de staging.'
            exit 1
          fi
          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://$SUPABASE_PROJECT_REF.supabase.co" ]; then
            echo '::error::NEXT_PUBLIC_SUPABASE_URL del Environment develop no apunta a SUPABASE_DEVELOP_PROJECT_REF.'
            exit 1
          fi
      # Par VAPID descartable por corrida: el aviso push necesita una clave pública válida en el bundle y la privada
      # en el servidor. No es un secreto del proyecto y muere con el runner.
      - name: Generate throwaway VAPID keys
        id: vapid
        run: |
          keys="$(node -e "const k = require('web-push').generateVAPIDKeys(); console.log(k.publicKey + ' ' + k.privateKey);")"
          public="${keys%% *}"
          private="${keys##* }"
          echo "::add-mask::$private"
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "private=$private" >> "$GITHUB_OUTPUT"
      # PR612-H01: el esquema de env admite Maps vacío y el build pasaría igual; sin estas variables el E2E falla
      # lejos de la causa. Se nombra la variable que falta, nunca su valor.
      - name: Validate Maps public configuration
        shell: bash
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" ]; then
            echo '::error::Falta la variable NEXT_PUBLIC_GOOGLE_MAPS_API_KEY en el Environment develop.'
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID" ]; then
            echo '::error::Falta la variable NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID en el Environment develop.'
            exit 1
          fi
      # PR610-H01: el build del código de la PR solo ve variables públicas; las NEXT_PUBLIC_* quedan embebidas en el
      # bundle, así que se fijan acá y no en el arranque. Maps usa la clave y el Map ID públicos del Environment, los
      # mismos que el Preview: con una clave falsa, Google rompe la vista de viaje en los specs que no lo interceptan.
      - name: Build PR without privileged secrets
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ steps.vapid.outputs.public }}
        run: pnpm build
      - name: Run preview E2E gate
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3100
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_DEVELOP_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ steps.vapid.outputs.public }}
          VAPID_PRIVATE_KEY: ${{ steps.vapid.outputs.private }}
          DNI_HMAC_SECRET: ${{ secrets.DNI_HMAC_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          E2E_TEST: 'true'
        shell: bash
        # Servidor y Playwright: los secretos privilegiados no existen en ningún otro step. La salida del servidor
        # queda en RUNNER_TEMP y nunca se sube. T-331: los specs se descubren por proyecto de playwright.config.ts:
        # chromium corre todos los del SHA exacto y global-settings, después y en serie.
        run: |
          pnpm start -H 127.0.0.1 -p 3100 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 "$APP_URL/api/health")"
          if [ "$code" != '200' ]; then
            echo "::error::$APP_URL/api/health respondió $code: el build del runner no levantó."
            exit 1
          fi
          pnpm exec playwright test --project=chromium --workers=1
          pnpm exec playwright test --project=global-settings --workers=1 --pass-with-no-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  report:
    name: report-preview-status
    needs: [resolve, e2e]
    # La corrida vive en develop, no en la PR: el resultado se publica como commit status del SHA probado.
    if: always() && needs.resolve.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Publish e2e-preview commit status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          case "$RESULT" in
            success) state=success; description='trusted E2E gate GREEN contra el build del runner' ;;
            failure) state=failure; description='trusted E2E gate RED contra el build del runner' ;;
            *) state=error; description="E2E no corrió ($RESULT): re-ejecutar el run" ;;
          esac
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f context=e2e-preview -f state="$state" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
