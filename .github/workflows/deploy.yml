name: deploy

# T-315: la app se publica después de la base. `migrate` corre con cada push a staging o main; este workflow
# espera a que termine y solo despliega si terminó verde, con el mismo commit. Si la migración o el drift de
# tipos fallan, la app nueva no sale contra un esquema viejo.
on:
  workflow_run:
    workflows: [migrate]
    types: [completed]
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    name: deploy-staging
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      # Proyecto propio de staging en Vercel (`cadeapp-staging`): su dominio de producción es la URL estable de
      # staging. No es un secreto.
      APP_URL: https://cadeapp-staging.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      - name: Build and deploy to Vercel (staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo '::error::Faltan VERCEL_TOKEN, VERCEL_ORG_ID o VERCEL_PROJECT_ID en el ambiente staging.'
            exit 1
          fi
          pnpm dlx vercel@61.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@61.0.0 build --prod --token="$VERCEL_TOKEN"
          url="$(pnpm dlx vercel@61.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Deployment: $url"
      - name: Health check
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
            --max-time 15 "$APP_URL/api/health"


  e2e-staging:
    name: e2e-staging
    needs: staging
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'staging'
    uses: ./.github/workflows/e2e-staging.yml
    with:
      target_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  production:
    name: deploy-production
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      APP_URL: ${{ vars.PRODUCTION_APP_URL }}
    steps:
      - name: Require authorized release actor
        env:
          # Quien hizo el push que disparó migrate, no quien relanzó el run.
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          if [ "$RUN_ACTOR" != 'Lautaro073' ]; then
            echo '::error::El deploy de production requiere un release iniciado por Lautaro073.'
            exit 1
          fi
          if [ -z "$APP_URL" ]; then
            echo '::error::Falta la variable PRODUCTION_APP_URL para verificar /api/health.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      - name: Build and deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo '::error::Faltan VERCEL_TOKEN, VERCEL_ORG_ID o VERCEL_PROJECT_ID en el ambiente production.'
            exit 1
          fi
          pnpm dlx vercel@61.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@61.0.0 build --prod --token="$VERCEL_TOKEN"
          url="$(pnpm dlx vercel@61.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Deployment: $url"
      - name: Health check
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
            --max-time 15 "$APP_URL/api/health"
