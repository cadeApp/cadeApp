name: migrate

on:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: migrate-${{ github.ref_name == 'main' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    name: migrate-staging
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo '::error::Faltan credenciales o el ref de Supabase en el ambiente staging.'
            exit 1
          fi
          pnpm supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm supabase db push --yes
      - name: Detect committed types drift against staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          # Este es el unico momento en que staging es la verdad: las migraciones
          # del repo acaban de aplicarse. Si los tipos generados desde staging no
          # coinciden con los commiteados, o staging se movio por fuera del repo
          # -alguien toco el panel- o el archivo quedo viejo.
          #
          # No esta en el job de production a proposito: alla el db push ya se
          # aplico cuando esto correria, y un rojo marcaria una release que ya
          # toco la base. Aca el rojo es barato y llega antes de promover.
          pnpm db:types
          git diff --exit-code -- src/types/database.types.ts

  production:
    name: migrate-production
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Require authorized release actor
        run: |
          if [ "$GITHUB_ACTOR" != 'Lautaro073' ]; then
            echo '::error::La migración de production requiere un release iniciado por Lautaro073.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to production after environment approval
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo '::error::Faltan credenciales o el ref de Supabase en el ambiente production.'
            exit 1
          fi
          if [ -z "$SUPABASE_STAGING_PROJECT_REF" ] || [ "$SUPABASE_PROJECT_REF" = "$SUPABASE_STAGING_PROJECT_REF" ]; then
            echo '::error::El ref de production debe existir y ser distinto al de staging.'
            exit 1
          fi
          pnpm supabase link --project-ref "$SUPABASE_PROJECT_REF"
          pnpm supabase db push --yes
