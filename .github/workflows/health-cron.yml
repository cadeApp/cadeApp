name: health-cron

# T-316: el plan Hobby de Vercel solo admite crons diarios, así que el chequeo de uptime de T-310 cada 10 minutos
# corre desde acá. El endpoint no cambia: sigue exigiendo `Authorization: Bearer <CRON_SECRET>` y avisa por
# Discord si algo no responde. Los schedule de Actions pueden atrasarse unos minutos; para uptime alcanza.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-cron
  cancel-in-progress: false

jobs:
  staging:
    name: health-cron-staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      APP_URL: https://cadeapp-staging.vercel.app
    steps:
      - name: Call /api/cron/health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo '::error::Falta CRON_SECRET en el ambiente staging.'
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/health"

  production:
    name: health-cron-production
    if: vars.PRODUCTION_APP_URL != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      APP_URL: ${{ vars.PRODUCTION_APP_URL }}
    steps:
      - name: Call /api/cron/health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo '::error::Falta CRON_SECRET en el ambiente production.'
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/health"
