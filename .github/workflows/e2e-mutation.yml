name: e2e-mutation

# T-347: mutaciones RED de E2E sin pushear ni desplegar código roto. Un `repository_dispatch` con el type
# `e2e.mutation.requested` y `client_payload` `{ target: "develop", mutation }` pide aplicar una mutación del
# catálogo revisado (`e2e/mutations/`) a un checkout efímero de la punta mergeada de develop y demostrar control
# GREEN y mutante RED contra un build en 127.0.0.1 dentro de este runner. Ninguna PR es target (PR294-A01).
#
# `repository_dispatch` corre siempre con el workflow de la rama por defecto: el control plane (este archivo,
# e2e-mutation.mjs, el manifest y los patches) sale de ese checkout. El `client_payload` es dato: solo lo lee
# e2e-mutation.mjs desde GITHUB_EVENT_PATH y nunca se interpola acá.
#
# Evidencia segura por construcción (PR294-H02): los reportes crudos y la salida de los procesos se generan con
# secretos en el entorno; viven en MUTATION_RAW_DIR, que nunca se sube y se borra al final. El artifact es una
# allowlist de archivos minimizados que arma e2e-mutation.mjs.
on:
  repository_dispatch:
    types:
      - e2e.mutation.requested

permissions: {}

jobs:
  mutation:
    name: e2e-mutation
    runs-on: ubuntu-latest
    environment: develop
    timeout-minutes: 30
    permissions:
      contents: read
    # El mismo grupo que e2e-preview: Supabase Develop es compartido.
    concurrency:
      group: cadeapp-develop-e2e
      cancel-in-progress: false
    env:
      MUTATION_CATALOG_DIR: ${{ github.workspace }}/trusted/e2e/mutations
      MUTATION_TARGET_DIR: ${{ github.workspace }}/target
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3100
    steps:
      - name: Initialize mutation directories
        run: |
          printf 'MUTATION_RAW_DIR=%s/e2e-mutation-raw\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MUTATION_EVIDENCE_DIR=%s/e2e-mutation\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      - name: Resolve mutation target
        id: target
        run: node trusted/.github/workflows/e2e-mutation.mjs resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Checkout target SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: target
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.0
          package_json_file: target/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: target
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Verify Supabase Develop target and exclude production
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_DEVELOP_PROJECT_REF }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
        run: node trusted/.github/workflows/e2e-mutation.mjs check-env
      - name: Prepare raw and evidence directories
        run: mkdir -p "$MUTATION_RAW_DIR" "$MUTATION_EVIDENCE_DIR"
      - name: Control run (unmutated)
        env:
          MUTATION_ID: ${{ steps.target.outputs.mutation }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_DEVELOP_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DNI_HMAC_SECRET: ${{ secrets.DNI_HMAC_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          E2E_TEST: 'true'
        run: node trusted/.github/workflows/e2e-mutation.mjs run-phase control
      - name: Apply mutation to the ephemeral checkout
        id: apply
        working-directory: target
        env:
          PATCH_FILE: ${{ github.workspace }}/trusted/e2e/mutations/${{ steps.target.outputs.patch }}
        run: |
          if git apply --check "$PATCH_FILE" && git apply "$PATCH_FILE"; then
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Mutant run
        if: steps.apply.outputs.applied == 'true'
        env:
          MUTATION_ID: ${{ steps.target.outputs.mutation }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_DEVELOP_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DNI_HMAC_SECRET: ${{ secrets.DNI_HMAC_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          E2E_TEST: 'true'
        run: node trusted/.github/workflows/e2e-mutation.mjs run-phase mutant
      - name: Restore the checkout
        if: always() && steps.apply.outputs.applied == 'true'
        working-directory: target
        env:
          PATCH_FILE: ${{ github.workspace }}/trusted/e2e/mutations/${{ steps.target.outputs.patch }}
        run: |
          git apply -R "$PATCH_FILE"
          git diff --exit-code
      - name: Classify result
        if: always() && steps.target.outcome == 'success'
        env:
          MUTATION_ID: ${{ steps.target.outputs.mutation }}
          MUTATION_TARGET_SHA: ${{ steps.target.outputs.sha }}
          MUTATION_PATCH_APPLIED: ${{ steps.apply.outputs.applied }}
        run: node trusted/.github/workflows/e2e-mutation.mjs classify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.target.outcome == 'success'
        with:
          name: e2e-mutation-${{ steps.target.outputs.mutation }}-${{ steps.target.outputs.sha7 }}
          # Allowlist explícita de la evidencia minimizada: nunca el directorio raw ni salidas de procesos.
          path: |
            ${{ runner.temp }}/e2e-mutation/summary.json
            ${{ runner.temp }}/e2e-mutation/control.json
            ${{ runner.temp }}/e2e-mutation/mutant.json
            ${{ runner.temp }}/e2e-mutation/${{ steps.target.outputs.patch }}
          if-no-files-found: error
          retention-days: 14
      - name: Remove raw reports
        if: always()
        run: rm -rf "$MUTATION_RAW_DIR"
